name: Unit Test

on:
  schedule:  # UTC
  - cron:  '0 0 * * *'

jobs:
  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4.1.7
        with:
          ref: jakarta

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk
          architecture: x64

      - name: Test
        id: run_test
        run: |
          ./mvnw test
